name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .
      - run: python -m compileall -q EventCrawler main.py tests
      - run: python -m unittest discover -s tests -v
      - run: python -m pip check
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: EventCrawler/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: EventCrawler
      - run: npm audit --omit=dev
        working-directory: EventCrawler
