<!doctype html>
<html><body>
<h1>Early Free Opportunities</h1>
<p><a href="/">Dashboard</a></p>
<table border="1">
<tr><th>Event</th><th>Region</th><th>Product</th><th>Price</th><th>Available</th><th>Recent</th><th>Early</th><th>Score</th></tr>
{% for r in rows %}
<tr>
  <td><a href="/event/{{ r.event_id }}">{{ r.event_name }}</a></td>
  <td>{{ r.region }}</td>
  <td>{{ r.product_name }}</td>
  <td>{{ r.price_text }}</td>
  <td>{{ r.is_available }}</td>
  <td>{{ r.is_recent }}</td>
  <td>{{ r.is_early_free_opportunity }}</td>
  <td>{{ r.score }}</td>
</tr>
{% endfor %}
</table>
</body></html>
