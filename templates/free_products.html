<!doctype html>
<html><body>
<h1>Free Products</h1>
<p><a href="/">Dashboard</a></p>
<table border="1">
<tr><th>Event</th><th>Product</th><th>Available</th><th>Price</th><th>Link</th></tr>
{% for p in products %}
<tr>
  <td>{{ p.event_name }}</td>
  <td>{{ p.product_name }}</td>
  <td>{{ p.is_available }}</td>
  <td>{{ p.price_text }}</td>
  <td>{% if p.event_url %}<a href="{{ p.event_url }}">event</a>{% endif %}</td>
</tr>
{% endfor %}
</table>
</body></html>
