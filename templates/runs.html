<!doctype html>
<html><body>
<h1>Extraction Runs</h1>
<p><a href="/">Dashboard</a></p>
<table border="1">
<tr><th>Event URL</th><th>Mode</th><th>Confidence</th><th>Valid</th><th>Issues</th><th>Created</th></tr>
{% for r in runs %}
<tr><td>{{ r.event_url }}</td><td>{{ r.mode }}</td><td>{{ r.confidence }}</td><td>{{ r.validation_ok }}</td><td>{{ r.issues_json }}</td><td>{{ r.created_at }}</td></tr>
{% endfor %}
</table>
</body></html>
