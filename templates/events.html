<!doctype html>
<html><body>
<h1>Events</h1>
<p><a href="/">Dashboard</a></p>
<table border="1">
<tr><th>Name</th><th>Region</th><th>Date</th><th>Address</th><th>Phone</th><th>Email</th><th>Score</th></tr>
{% for e in events %}
<tr>
  <td><a href="/event/{{ e.id }}">{{ e.name or e.event_url }}</a></td>
  <td>{{ e.region }}</td>
  <td>{{ e.event_date }}</td>
  <td>{{ e.address }}</td>
  <td>{{ e.contact_phone }}</td>
  <td>{{ e.contact_email }}</td>
  <td>{{ e.score }}</td>
</tr>
{% endfor %}
</table>
</body></html>
