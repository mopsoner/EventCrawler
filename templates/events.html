<!doctype html>
<html><body>
<h1>Events</h1>
<p><a href="/">Dashboard</a></p>
<table border="1">
<tr><th>ID</th><th>Name</th><th>Region</th><th>City</th><th>Score</th><th>Mode</th><th>Confidence</th></tr>
{% for e in events %}
<tr>
  <td>{{ e.id }}</td>
  <td><a href="/event/{{ e.id }}">{{ e.name }}</a></td>
  <td>{{ e.region }}</td>
  <td>{{ e.city }}</td>
  <td>{{ e.score }}</td>
  <td>{{ e.extraction_mode }}</td>
  <td>{{ e.extraction_confidence }}</td>
</tr>
{% endfor %}
</table>
</body></html>
